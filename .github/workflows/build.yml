name: Build

on:
  push:
    branches: [ main, develop ]
    paths-ignore:
      - "**/*.md"
      - "LICENSE"
      - ".gitignore"
      - ".editorconfig"
  pull_request:
    branches: [ main, develop ]
    paths-ignore:
      - "**/*.md"
      - "LICENSE"
      - ".gitignore"
      - ".editorconfig"
  workflow_dispatch:

env:
  DOTNET_VERSION: "8.0.x"
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

permissions:
  contents: read

jobs:
  build:
    name: Build (x64)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore src/DeZ4pAndroidManager/DeZ4pAndroidManager.csproj

      - name: Build (Release)
        run: dotnet build src/DeZ4pAndroidManager/DeZ4pAndroidManager.csproj -c Release --no-restore

      - name: Download bundled tools (adb, fastboot, scrcpy)
        shell: pwsh
        run: |
          cd src/DeZ4pAndroidManager/tools
          .\download-tools.ps1

      - name: Publish (Release x64)
        run: |
          dotnet publish src/DeZ4pAndroidManager/DeZ4pAndroidManager.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:DebugType=embedded `
            -p:PublishReadyToRun=false `
            -o artifacts/win-x64

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: DeZ4pAndroidManager-x64-${{ github.sha }}
          path: artifacts/win-x64/
          retention-days: 14
          if-no-files-found: error