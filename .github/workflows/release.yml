name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v1.0.0)"
        required: true
        type: string

env:
  DOTNET_VERSION: "8.0.x"
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

permissions:
  contents: write

jobs:
  build:
    name: Build Release
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $tag = if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            "${{ github.event.inputs.tag }}"
          } else {
            "${{ github.ref_name }}"
          }
          $ver = $tag.TrimStart("v")
          "tag=$tag"     >> $env:GITHUB_OUTPUT
          "version=$ver" >> $env:GITHUB_OUTPUT
          Write-Host "Tag: $tag  |  Version: $ver"

      - name: Restore
        run: dotnet restore DeZ4pAndroidManager.sln

      - name: Publish (win-x64)
        shell: pwsh
        run: |
          dotnet publish src/DeZ4pAndroidManager/DeZ4pAndroidManager.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:DebugType=embedded `
            -p:Version=${{ steps.version.outputs.version }} `
            -p:AssemblyVersion=${{ steps.version.outputs.version }}.0 `
            -p:FileVersion=${{ steps.version.outputs.version }}.0 `
            -p:InformationalVersion=${{ steps.version.outputs.version }} `
            -o artifacts/win-x64

      - name: Copy tools (adb, fastboot, scrcpy)
        shell: pwsh
        run: |
          $srcTools = "src/DeZ4pAndroidManager/tools"
          $dstTools = "artifacts/win-x64/tools"
          if (Test-Path $srcTools) {
            robocopy $srcTools $dstTools /E /NFL /NDL /NJH /NJS /NC /NS
            Write-Host "[OK] Tools copied"
          } else {
            Write-Host "[WARN] Source tools folder not found: $srcTools"
          }

      - name: Create Portable ZIP
        shell: pwsh
        run: |
          $ver = "${{ steps.version.outputs.version }}"
          $zip = "artifacts/DeZ4pAndroidManager-Portable-x64-$ver.zip"
          Compress-Archive -Path "artifacts/win-x64/*" -DestinationPath $zip -CompressionLevel Optimal
          Write-Host "[OK] Portable ZIP created: $zip"

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            $iscc = "C:\Program Files\Inno Setup 6\ISCC.exe"
          }
          Write-Host "ISCC: $iscc"
          echo "ISCC_PATH=$iscc" >> $env:GITHUB_ENV

      - name: Build Installer
        shell: pwsh
        run: |
          $ver = "${{ steps.version.outputs.version }}"
          # Update .iss version dynamically
          $iss = "installer/DeZ4pAndroidManager.iss"
          $content = Get-Content $iss -Raw
          $content = $content -replace '#define AppVersion\s+"[^"]+"', "#define AppVersion `"$ver`""
          [System.IO.File]::WriteAllText((Resolve-Path $iss), $content, [System.Text.UTF8Encoding]::new($true))
          # Compile
          Push-Location installer
          & "$env:ISCC_PATH" DeZ4pAndroidManager.iss
          Pop-Location

      - name: Prepare release assets
        shell: pwsh
        run: |
          $ver = "${{ steps.version.outputs.version }}"
          New-Item -ItemType Directory -Force -Path "release-assets" | Out-Null
          Copy-Item "artifacts/DeZ4pAndroidManager-Portable-x64-$ver.zip" "release-assets/" -Force
          $setup = Get-ChildItem "installer/Output" -Filter "*.exe" | Select-Object -First 1
          if ($setup) {
            Copy-Item $setup.FullName "release-assets/" -Force
            Write-Host "[OK] Setup copied: $($setup.Name)"
          }
          Get-ChildItem "release-assets" | ForEach-Object {
            $mb = [math]::Round($_.Length / 1MB, 2)
            Write-Host "  $($_.Name) - $mb MB"
          }

      - name: Extract changelog
        id: changelog
        shell: pwsh
        run: |
          $ver = "${{ steps.version.outputs.version }}"
          $notes = "Release $ver"
          if (Test-Path "CHANGELOG.md") {
            $content = Get-Content "CHANGELOG.md" -Raw
            $pattern = "## \[$([regex]::Escape($ver))\]"
            if ($content -match $pattern) {
              $start = $content.IndexOf($matches[0])
              $rest = $content.Substring($start)
              $nextMatch = [regex]::Match($rest.Substring(10), "## \[")
              if ($nextMatch.Success) {
                $notes = $rest.Substring(0, 10 + $nextMatch.Index).Trim()
              } else {
                $notes = $rest.Trim()
              }
            }
          }
          $notes | Out-File -FilePath "release-notes.md" -Encoding utf8
          Write-Host "[OK] Release notes prepared"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: DeZ4p Android Manager ${{ steps.version.outputs.tag }}
          body_path: release-notes.md
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release-assets/*.exe
            release-assets/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}